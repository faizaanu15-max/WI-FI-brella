<!DOCTYPE html>
<html>
<head>
    <title>Wi-Fi-brella</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #dff6ff;
            text-align: center;
            overflow: hidden;
        }

        h1 {
            margin: 15px;
        }

        #game {
            width: 900px;
            height: 550px;
            margin: auto;
            position: relative;
            background: #8fd694;
            border: 5px solid #222;
            overflow: hidden;
        }

        #player {
            position: absolute;
            font-size: 55px;
            left: 420px;
            top: 250px;
        }

        .tree {
            position: absolute;
            font-size: 50px;
        }

        #tree1 { left: 100px; top: 100px; }
        #tree2 { left: 700px; top: 80px; }
        #tree3 { left: 200px; top: 400px; }
        #tree4 { left: 750px; top: 400px; }

        .signal {
            position: absolute;
            font-size: 35px;
        }

        #s1 { left: 250px; top: 150px; }
        #s2 { left: 600px; top: 250px; }
        #s3 { left: 350px; top: 420px; }

        #message {
            position: absolute;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            background: white;
            padding: 12px 25px;
            border-radius: 20px;
            font-size: 20px;
            font-weight: bold;
        }

        #score {
            font-size: 22px;
            margin: 10px;
        }

        #instructions {
            font-size: 18px;
        }
    </style>
</head>

<body>

<h1>☂️ Wi-Fi Umbrella: Signal Hunter</h1>

<div id="score">Score: 0</div>

<div id="instructions">
    Use ⬆️ ⬇️ ⬅️ ➡️ keys to move the umbrella
</div>

<div id="game">

    <div id="message">Searching for signal...</div>

    <div id="player">☂️</div>

    <div class="tree" id="tree1">🌳</div>
    <div class="tree" id="tree2">🌳</div>
    <div class="tree" id="tree3">🌳</div>
    <div class="tree" id="tree4">🌳</div>

    <div class="signal" id="s1">📶</div>
    <div class="signal" id="s2">📶</div>
    <div class="signal" id="s3">📶</div>

</div>

<script>

let player = document.getElementById("player");
let message = document.getElementById("message");
let scoreText = document.getElementById("score");

let x = 420;
let y = 250;
let score = 0;

let signals = [
    {x:250, y:150},
    {x:600, y:250},
    {x:350, y:420}
];

document.addEventListener("keydown", function(event) {

    let speed = 15;

    if(event.key === "ArrowUp") {
        y -= speed;
    }

    if(event.key === "ArrowDown") {
        y += speed;
    }

    if(event.key === "ArrowLeft") {
        x -= speed;
    }

    if(event.key === "ArrowRight") {
        x += speed;
    }

    // Keep player inside game
    if(x < 0) x = 0;
    if(y < 0) y = 0;

    if(x > 840) x = 840;
    if(y > 490) y = 490;

    player.style.left = x + "px";
    player.style.top = y + "px";

    checkSignal();
});


function checkSignal() {

    let found = false;

    for(let i = 0; i < signals.length; i++) {

        let distance = Math.sqrt(
            Math.pow(x - signals[i].x, 2) +
            Math.pow(y - signals[i].y, 2)
        );

        if(distance < 80) {

            found = true;

            if(distance < 35) {
                message.innerHTML = "🟢 GOOD SIGNAL! +10";
                score += 10;
            }
            else {
                message.innerHTML = "🟡 WEAK SIGNAL!";
            }

            scoreText.innerHTML = "Score: " + score;

            break;
        }
    }

    if(!found) {
        message.innerHTML = "🔴 NO SIGNAL! Keep searching...";
    }
}

</script>

</body>
</html>
