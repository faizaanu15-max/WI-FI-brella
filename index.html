
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>WiFi-Brella</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #111827, #1e293b);
            color: white;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 90%;
            max-width: 500px;
            text-align: center;
        }

        .logo {
            font-size: 55px;
            margin-bottom: 10px;
        }

        h1 {
            font-size: 38px;
            margin-bottom: 5px;
        }

        .tagline {
            color: #94a3b8;
            margin-bottom: 30px;
        }

        .card {
            background: #0f172a;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.4);
        }

        .wifi-icon {
            font-size: 65px;
            margin-bottom: 15px;
        }

        .status {
            font-size: 25px;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .signal-bar {
            width: 100%;
            height: 20px;
            background: #334155;
            border-radius: 20px;
            overflow: hidden;
            margin: 15px 0;
        }

        .signal {
            height: 100%;
            width: 75%;
            background: #22c55e;
            border-radius: 20px;
            transition: 0.5s;
        }

        .message {
            font-size: 18px;
            margin: 20px 0;
            color: #cbd5e1;
        }

        .button {
            border: none;
            padding: 14px 25px;
            border-radius: 30px;
            background: #2563eb;
            color: white;
            font-size: 17px;
            cursor: pointer;
        }

        .button:hover {
            background: #1d4ed8;
        }

        .info {
            margin-top: 25px;
            display: flex;
            justify-content: space-around;
        }

        .box {
            background: #1e293b;
            padding: 15px;
            border-radius: 12px;
            width: 45%;
        }

        .value {
            font-size: 24px;
            font-weight: bold;
            margin-top: 5px;
        }

        footer {
            margin-top: 25px;
            color: #64748b;
            font-size: 13px;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="logo">☂️</div>

    <h1>WiFi-Brella</h1>

    <p class="tagline">
        The umbrella that protects you from bad Wi-Fi!
    </p>

    <div class="card">

        <div class="wifi-icon" id="wifiIcon">📶</div>

        <div class="status" id="status">
            Wi-Fi Strong!
        </div>

        <p>Signal Strength</p>

        <div class="signal-bar">
            <div class="signal" id="signal"></div>
        </div>

        <p id="dbm">-45 dBm</p>

        <div class="message" id="message">
            😎 Wow! Finally connected!
        </div>

        <button class="button" onclick="scanWiFi()">
            🔍 Scan Wi-Fi
        </button>

        <div class="info">

            <div class="box">
                <p>Wi-Fi</p>
                <div class="value" id="wifiName">
                    FAIZA
                </div>
            </div>

            <div class="box">
                <p>Status</p>
                <div class="value" id="connection">
                    Connected
                </div>
            </div>

        </div>

    </div>

    <footer>
        Team Peda Teams • Useless Product
    </footer>

</div>


<script>

function scanWiFi() {

    // Random signal for demonstration
    let signal = Math.floor(Math.random() * 61) - 90;

    document.getElementById("dbm").innerText =
        signal + " dBm";

    let bar = document.getElementById("signal");
    let status = document.getElementById("status");
    let message = document.getElementById("message");
    let wifiIcon = document.getElementById("wifiIcon");

    if (signal >= -50) {

        bar.style.width = "100%";
        bar.style.background = "#22c55e";

        status.innerText = "Wi-Fi Strong! 🟢";
        message.innerText =
            "😎 Wow! Finally connected!";
        wifiIcon.innerText = "📶";

    }

    else if (signal >= -65) {

        bar.style.width = "70%";
        bar.style.background = "#eab308";

        status.innerText = "Wi-Fi Medium 🟡";
        message.innerText =
            "Hmm... you're moving away!";
        wifiIcon.innerText = "📶";

    }

    else if (signal >= -80) {

        bar.style.width = "40%";
        bar.style.background = "#f97316";

        status.innerText = "Wi-Fi Weak 🟠";
        message.innerText =
            "BRO! Turn back!";
        wifiIcon.innerText = "📡";

    }

    else {

        bar.style.width = "10%";
        bar.style.background = "#ef4444";

        status.innerText = "NO Wi-Fi! 🔴";
        message.innerText =
            "😂 Congratulations. You are offline!";
        wifiIcon.innerText = "❌";
    }
}

</script>

</body>
</html>
